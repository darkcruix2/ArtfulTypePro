name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version name to release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gcc-aarch64-linux-gnu

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Debian Packages
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TAURI: cargo-tauri
        run: |
          make deb
          make deb-cli
          make deb-arm64 || echo "ARM64 GUI build skipped in runner environment"
          make deb-cli-arm64 || echo "ARM64 CLI build skipped in runner environment"

      - name: Stage Release Artifacts
        run: |
          mkdir -p dist-release
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          cp -f src-tauri/target/release/bundle/deb/artfultype-rs_${VERSION}*.deb dist-release/ 2>/dev/null || true
          cp -f releases/artfultype-cli_${VERSION}*.deb dist-release/ 2>/dev/null || true
          cp -f releases/artfultype-rs_${VERSION}*.deb dist-release/ 2>/dev/null || true
          cp -f releases/artfultype-rs-${VERSION}*.rpm dist-release/ 2>/dev/null || true
          cp -f releases/artfultype-cli-${VERSION}*.rpm dist-release/ 2>/dev/null || true
          cp -f releases/*${VERSION}* dist-release/ 2>/dev/null || true
          cp -f releases/artfultype-rs-windows-x64.exe dist-release/ 2>/dev/null || true
          cp -f releases/artfultype-cli-windows-x64.exe dist-release/ 2>/dev/null || true
          echo "Artifacts to upload:"
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ArtfulType Pro ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*
