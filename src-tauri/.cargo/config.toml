# ── Cargo cross-compilation configuration ─────────────────────────────────────
#
# This file tells Cargo which linker to use when cross-compiling for targets
# that differ from the build host.  The file is intentionally kept in
# src-tauri/.cargo/ so it only affects the Tauri crate tree.

# ── ARM64 / aarch64 (Raspberry Pi CM4, uConsole, RPi 4/5) ────────────────────
# Requires: sudo apt-get install gcc-aarch64-linux-gnu
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# ── ARMv7 32-bit (older Raspberry Pi models) ─────────────────────────────────
# Uncomment if you also need armhf packages.
# Requires: sudo apt-get install gcc-arm-linux-gnueabihf
# [target.armv7-unknown-linux-gnueabihf]
# linker = "arm-linux-gnueabihf-gcc"
