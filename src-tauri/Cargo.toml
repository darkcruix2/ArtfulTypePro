[package]
name = "artfultype-rs"
version = "0.30.2"
description = "ArtfulType Pro — Distraction-free Markdown & Code Editor"
authors = ["Roland"]
edition = "2021"

[lib]
name = "artfultype_rs_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "artfultype-rs"
path = "src/main.rs"

[[bin]]
name = "art"
path = "src/cli_main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13.4"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
base64 = "0.22"
ratatui = "0.29.0"
crossterm = "0.28.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
